site_name: pomodoro
site_description: A keyboard-driven Pomodoro TUI with kanban, projects, sprints, and local-first SQLite persistence.
site_url: https://prajwalmahajan101.github.io/pomban/
repo_url: https://github.com/prajwalmahajan101/pomban
repo_name: prajwalmahajan101/pomban
edit_uri: edit/main/docs/site/

# Source content lives under docs/site/ so docs/adr/ and docs/screenshots/
# don't get pulled into the nav by accident.
docs_dir: docs/site

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs/site
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Install: install.md
  - Quick start: quickstart.md
  - User guide: user-guide.md
  - Key bindings: keybindings.md
  - Configuration: configuration.md
  - Troubleshooting: troubleshooting.md
  - Development: development.md
  - Architecture (ADRs): adr.md
  - Changelog: changelog.md
  - Roadmap: roadmap.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/prajwalmahajan101/pomban
