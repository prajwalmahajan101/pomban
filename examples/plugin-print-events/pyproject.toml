[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pomodoro-plugin-print-events"
version = "0.1.0"
requires-python = ">=3.11"

[project.entry-points."pomodoro.hooks"]
print_events = "print_events:plugin"

[tool.setuptools]
py-modules = ["print_events"]
