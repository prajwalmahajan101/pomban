[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pomodoro"
version = "0.1.0"
description = "Pomodoro dashboard TUI with tasks and stats"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Prajwal Mahajan", email = "prajwal.mahajan101@gmail.com" }]
dependencies = [
    "textual>=0.79",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
pomodoro = "pomodoro.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
